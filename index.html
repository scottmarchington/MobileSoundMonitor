<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live dBA &amp; dBC Sound Level Monitor</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent-a: #38bdf8;
      --accent-c: #f472b6;
      --accent-peak: #fbbf24;
      --border: #334155;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 960px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { margin: 0; font-size: 1.4rem; }
    .status-badge {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .metric-label { color: var(--muted); font-size: 0.9rem; margin-bottom: 6px; }
    .metric-value { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .dba { color: var(--accent-a); }
    .dbc { color: var(--accent-c); }
    .peak { color: var(--accent-peak); }
    .chart-box { height: 340px; position: relative; }
    .publisher-panel {
      margin-top: 20px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }
    input, button, select {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
    }
    button {
      background: #2563eb;
      border-color: #2563eb;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button.danger { background: #dc2626; border-color: #dc2626; }
    button.secondary { background: var(--card); border-color: var(--border); }
    .hidden { display: none; }
    .cal-row {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Sound Level Monitor (dBA / dBC)</h1>
      <div id="connection-status" class="status-badge">Connecting to feed...</div>
    </header>

    <!-- Live Readout Cards -->
    <div class="grid">
      <div class="card">
        <div class="metric-label">A-Weighted (dBA Leq)</div>
        <div id="dba-val" class="metric-value dba">--.-</div>
      </div>
      <div class="card">
        <div class="metric-label">C-Weighted (dBC Leq)</div>
        <div id="dbc-val" class="metric-value dbc">--.-</div>
      </div>
      <div class="card">
        <div class="metric-label">Window Peak (dBC)</div>
        <div id="peak-val" class="metric-value peak">--.-</div>
      </div>
    </div>

    <!-- View & Rollup Controls -->
    <div class="card" style="margin-bottom: 16px;">
      <div class="controls" style="margin-top: 0; justify-content: space-between;">
        <div class="controls" style="margin-top: 0;">
          <button id="mode-live-btn" type="button">Live (2s)</button>
          <button id="mode-1m-btn" class="secondary" type="button">1m Rollup</button>
          <button id="mode-5m-btn" class="secondary" type="button">5m Rollup</button>
        </div>
        <div class="controls" style="margin-top: 0;">
          <label for="lookback-select" style="color: var(--muted); font-size: 0.9rem;">Rollup Window:</label>
          <select id="lookback-select">
            <option value="1 hour">1h</option>
            <option value="3 hours">3h</option>
            <option value="6 hours" selected>6h</option>
            <option value="12 hours">12h</option>
            <option value="24 hours">24h</option>
            <option value="7 days">7d</option>
          </select>
          <button id="refresh-view-btn" class="secondary" type="button">Refresh</button>
        </div>
        <div class="controls" style="margin-top: 10px;">
          <label for="window-start-input" style="color: var(--muted); font-size: 0.9rem;">Rollup Start:</label>
          <input type="datetime-local" id="window-start-input" step="60" />
          <button id="shift-back-6h-btn" class="secondary" type="button">-6h</button>
          <button id="shift-fwd-6h-btn" class="secondary" type="button">+6h</button>
          <button id="load-6h-btn" class="secondary" type="button">Load 6h (1m)</button>
          <span id="window-range-label" style="color: var(--muted); font-size: 0.85rem;"></span>
        </div>
      </div>
    </div>

    <!-- Historical & Live Chart -->
    <div class="card">
      <div class="chart-box">
        <canvas id="splChart"></canvas>
      </div>
    </div>

    <!-- Cycle & Level-Change Highlights -->
    <div class="card" style="margin-top: 16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap: 10px; flex-wrap: wrap;">
        <strong>Cycle &amp; Level-Change Log (dBC)</strong>
        <span id="events-summary" style="color: var(--muted); font-size: 0.85rem;">Waiting for data...</span>
      </div>
      <ul id="events-list" style="list-style: none; padding: 0; margin: 12px 0 0 0; color: var(--muted); font-size: 0.9rem;">
        <li>No significant dBC level changes detected yet.</li>
      </ul>
    </div>

    <!-- Publisher Controls (For Your Desktop Only) -->
    <div class="card publisher-panel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>Desktop Broadcaster Controls</strong>
        <button id="toggle-login-btn" class="secondary" type="button">Broadcaster Login</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="controls hidden">
        <input type="email" id="email" placeholder="Supabase Admin Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Sign In</button>
      </form>

      <!-- Active Microphone & Broadcast Controls -->
      <div id="broadcast-controls" class="hidden">
        <div class="controls">
          <button id="start-mic-btn" type="button">Start Microphone &amp; Broadcast</button>
          <button id="stop-mic-btn" class="danger hidden" type="button">Stop Broadcast</button>
          <span id="pub-status" style="color: var(--muted); font-size: 0.9rem;">Ready</span>
        </div>
        <div class="cal-row">
          <label for="cal-offset">Calibration Offset (dB):</label>
          <input type="range" id="cal-offset" min="60" max="130" step="0.5" value="94" />
          <span id="cal-display">94.0 dB</span>
        </div>
        <div class="cal-row">
          <label for="dbc-trim">dBC Trim (dB):</label>
          <input type="range" id="dbc-trim" min="-20" max="20" step="0.5" value="0" />
          <span id="dbc-trim-display">+0.0 dB</span>
        </div>
      </div>
    </div>
  </div>

  <script>

    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJuZnppeGNjd2VscHdhc2Z2aWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyMDk4OTAsImV4cCI6MjExMDc4NTg5MH0.Ig3Wd5QoqG57-s8NFiFwZ6VDXxtVdYZQIERYXFDHe40';

    function formatTime(isoString) {
      const d = new Date(isoString);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function updateDisplayAndChart(row) {
      // Update cards with live data
      document.getElementById('dba-val').textContent = row.dba.toFixed(1);
      document.getElementById('dbc-val').textContent = row.dbc.toFixed(1);
      document.getElementById('peak-val').textContent = (row.peak_dbc ?? row.dbc).toFixed(1);

      // If displaying live view, render live chart
      if (viewMode === 'live') {
        splChart.data.labels.push(formatTime(row.created_at));
        splChart.data.datasets[0].data.push(row.dba);
        splChart.data.datasets[1].data.push(row.dbc);
        splChart.data.datasets[2].data.push(row.peak_dbc ?? row.dbc);

        if (splChart.data.labels.length > MAX_POINTS) {
          splChart.data.labels.shift();
          splChart.data.datasets.forEach(ds => ds.data.shift());
        }
        splChart.update();
      }
    }

    // ==========================================
    // 3. PUBLIC VIEWER: LOAD HISTORY & REALTIME
    // ==========================================
    async function initViewer() {
      const statusEl = document.getElementById('connection-status');

      const { data, error } = await db
        .from('readings')
        .select('created_at, dba, dbc, peak_dbc')
        .order('created_at', { ascending: false })

      }

      if (data && data.length > 0) {
        data.reverse().forEach(updateDisplayAndChart);
      }

      db.channel('public:readings')
        .on(

          { event: 'INSERT', schema: 'public', table: 'readings' },
          (payload) => {

        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {

          }
        });
    }

    initViewer();
// ==========================================
    // 4. AUTHENTICATION UI
    // ==========================================
    const toggleLoginBtn = document.getElementById('toggle-login-btn');
    const loginForm = document.getElementById('login-form');
    const broadcastControls = document.getElementById('broadcast-controls');

    toggleLoginBtn.addEventListener('click', () => {

    db.auth.onAuthStateChange((_event, session) => {

    loginForm.addEventListener('submit', async (e) => {

    // ==========================================
    // 5. WEB AUDIO API (A & C WEIGHTING + PUBLISH)
    // ==========================================
    let audioCtx = null;
    let micStream = null;
    let rafId = null;
    let publishTimer = null;
    let wakeLock = null;

    // Calibration slider
    let calibrationOffset = Number(localStorage.getItem('spl_cal_offset') || 94);
    const calSlider = document.getElementById('cal-offset');
    const calDisplay = document.getElementById('cal-display');
    calSlider.value = calibrationOffset;
    calDisplay.textContent = `${calibrationOffset.toFixed(1)} dB`;

    calSlider.addEventListener('input', (e) => {
      calibrationOffset = Number(e.target.value);
      calDisplay.textContent = `${calibrationOffset.toFixed(1)} dB`;
      localStorage.setItem('spl_cal_offset', calibrationOffset);
    });

    // DBC Trim slider
    let dbcTrim = Number(localStorage.getItem('spl_dbc_trim') || 0);
    const dbcTrimSlider = document.getElementById('dbc-trim');
    const dbcTrimDisplay = document.getElementById('dbc-trim-display');
    dbcTrimSlider.value = dbcTrim;
    dbcTrimDisplay.textContent = `${dbcTrim >= 0 ? '+' : ''}${dbcTrim.toFixed(1)} dB`;

    dbcTrimSlider.addEventListener('input', (e) => {
      dbcTrim = Number(e.target.value);
      dbcTrimDisplay.textContent = `${dbcTrim >= 0 ? '+' : ''}${dbcTrim.toFixed(1)} dB`;
      localStorage.setItem('spl_dbc_trim', dbcTrim);
    });

    /**
 * Pre-warped bilinear transform for a 2nd-order s-domain transfer function:
 *   H(s) = (n0*s^2 + n1*s + n2) / (d0*s^2 + d1*s + d2)
 * Pre-warps around `warpFreq` (Hz) so cutoff accuracy holds at 44.1 / 48 kHz.
 * Returns { feedForward: [b0, b1, b2], feedBack: [1, a1, a2] }.
 */
function bilinear2ndOrderPrewarped([n0, n1, n2], [d0, d1, d2], warpFreq, sampleRate) {
  const wd = 2 * Math.PI * warpFreq;
  const wa = 2 * sampleRate * Math.tan(Math.PI * warpFreq / sampleRate);
  const scale = wa / wd; // maps s -> s / scale so cutoff lands at warpFreq

  // Apply frequency scaling s -> s / scale to numerator and denominator
  const s2 = scale * scale;
  const sn0 = n0 * s2, sn1 = n1 * scale, sn2 = n2;
  const sd0 = d0 * s2, sd1 = d1 * scale, sd2 = d2;

  const k = 2 * sampleRate;
  const k2 = k * k;

  const a0 = sd0 * k2 + sd1 * k + sd2;
  const a1 = (2 * sd2 - 2 * sd0 * k2) / a0;
  const a2 = (sd0 * k2 - sd1 * k + sd2) / a0;

  const b0 = (sn0 * k2 + sn1 * k + sn2) / a0;
  const b1 = (2 * sn2 - 2 * sn0 * k2) / a0;
  const b2 = (sn0 * k2 - sn1 * k + sn2) / a0;

  return {
    feedForward: [b0, b1, b2],
    feedBack: [1, a1, a2]
  };
}

/**
 * Normalizes a chain of IIRFilterNodes so its combined magnitude at 1000 Hz is 1.0 (0.0 dB).
 */
function normalizeChainAt1kHz(ctx, nodes, outputNode) {
  const freqs = new Float32Array([1000]);
  const phaseDummy = new Float32Array(1);
  let totalMag = 1;

  for (const node of nodes) {
    const mag = new Float32Array(1);
    node.getFrequencyResponse(freqs, mag, phaseDummy);
    totalMag *= mag[0];
  }

  outputNode.gain.value = totalMag > 0 ? 1 / totalMag : 1;
}

/**
 * IEC 61672-1 C-weighting:
 *   C(s) = (w4^2 * s^2) / ((s + w1)^2 * (s + w4)^2)
 *   f1 = 20.598997 Hz, f4 = 12194.217 Hz
 */
function createCWeightingChain(ctx) {
  const fs = ctx.sampleRate;
  const f1 = 20.598997;
  const f4 = 12194.217;
  const w1 = 2 * Math.PI * f1;
  const w4 = 2 * Math.PI * f4;

  // Stage 1: 2nd-order high-pass at f1 -> s^2 / (s + w1)^2
  const hp1 = bilinear2ndOrderPrewarped([1, 0, 0], [1, 2 * w1, w1 * w1], f1, fs);

  // Stage 2: 2nd-order low-pass at f4 -> w4^2 / (s + w4)^2
  const lp4 = bilinear2ndOrderPrewarped([0, 0, w4 * w4], [1, 2 * w4, w4 * w4], f4, fs);

  const nodeHp1 = ctx.createIIRFilter(hp1.feedForward, hp1.feedBack);
  const nodeLp4 = ctx.createIIRFilter(lp4.feedForward, lp4.feedBack);
  const gainNode = ctx.createGain();

  nodeHp1.connect(nodeLp4);
  nodeLp4.connect(gainNode);

  normalizeChainAt1kHz(ctx, [nodeHp1, nodeLp4], gainNode);

  return { input: nodeHp1, output: gainNode, nodes: [nodeHp1, nodeLp4] };
}

/**
 * IEC 61672-1 A-weighting:
 *   A(s) = (w4^2 * s^4) / ((s + w1)^2 * (s + w2) * (s + w3) * (s + w4)^2)
 *   f1 = 20.598997 Hz, f2 = 107.65265 Hz, f3 = 737.86223 Hz, f4 = 12194.217 Hz
 */
function createAWeightingChain(ctx) {
  const fs = ctx.sampleRate;
  const f1 = 20.598997;
  const f2 = 107.65265;
  const f3 = 737.86223;
  const f4 = 12194.217;

  const w1 = 2 * Math.PI * f1;
  const w2 = 2 * Math.PI * f2;
  const w3 = 2 * Math.PI * f3;
  const w4 = 2 * Math.PI * f4;

  // Stage 1: s^2 / (s + w1)^2
  const hp1 = bilinear2ndOrderPrewarped([1, 0, 0], [1, 2 * w1, w1 * w1], f1, fs);

  // Stage 2: s^2 / ((s + w2)(s + w3)) = s^2 / (s^2 + (w2 + w3)s + w2*w3)
  const midWarpFreq = Math.sqrt(f2 * f3);
  const mid23 = bilinear2ndOrderPrewarped([1, 0, 0], [1, w2 + w3, w2 * w3], midWarpFreq, fs);

  // Stage 3: w4^2 / (s + w4)^2
  const lp4 = bilinear2ndOrderPrewarped([0, 0, w4 * w4], [1, 2 * w4, w4 * w4], f4, fs);

  const nodeHp1 = ctx.createIIRFilter(hp1.feedForward, hp1.feedBack);
  const nodeMid23 = ctx.createIIRFilter(mid23.feedForward, mid23.feedBack);
  const nodeLp4 = ctx.createIIRFilter(lp4.feedForward, lp4.feedBack);
  const gainNode = ctx.createGain();

  nodeHp1.connect(nodeMid23);
  nodeMid23.connect(nodeLp4);
  nodeLp4.connect(gainNode);

  normalizeChainAt1kHz(ctx, [nodeHp1, nodeMid23, nodeLp4], gainNode);

  return { input: nodeHp1, output: gainNode, nodes: [nodeHp1, nodeMid23, nodeLp4] };
}

    function computeDb(buffer, offset) {
      let sum = 0;
      for (let i = 0; i < buffer.length; i++) {
        sum += buffer[i] * buffer[i];
      }
      const rms = Math.sqrt(sum / buffer.length);
      const dbfs = 20 * Math.log10(Math.max(rms, 1e-7));
      return dbfs + offset;
    }

    function computeSamplePeakDb(buffer, offset) {
      let maxAbs = 0;
      for (let i = 0; i < buffer.length; i++) {
        const abs = Math.abs(buffer[i]);
        if (abs > maxAbs) maxAbs = abs;
      }
      const dbfs = 20 * Math.log10(Math.max(maxAbs, 1e-7));
      return dbfs + offset;
    }

    document.getElementById('start-mic-btn').addEventListener('click', async () => {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen').catch(() => null);
        }

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(micStream);

        const aChain = createAWeightingChain(audioCtx);
        const cChain = createCWeightingChain(audioCtx);

        const analyserA = audioCtx.createAnalyser();
        const analyserC = audioCtx.createAnalyser();
        analyserA.fftSize = 2048;
        analyserC.fftSize = 2048;

        source.connect(aChain.input);
        aChain.output.connect(analyserA);

        source.connect(cChain.input);
        cChain.output.connect(analyserC);

        const bufferA = new Float32Array(analyserA.fftSize);
        const bufferC = new Float32Array(analyserC.fftSize);

        // Energy accumulators for 2-second Leq batches
        let energySumA = 0;
        let energySumC = 0;
        let sampleCount = 0;
        let maxPeakC = -Infinity;

        function measureLoop() {
          // 1. Capture prerequisites
          analyserA.getFloatTimeDomainData(bufferA);
          analyserC.getFloatTimeDomainData(bufferC);
          const dbcOffset = calibrationOffset + dbcTrim;

          // 2. Calculate dB values
          const dba = computeDb(bufferA, calibrationOffset);
          const dbc = computeDb(bufferC, dbcOffset);
          const peakC = computeSamplePeakDb(bufferC, dbcOffset);

          // 3. Sum dB energy of all samples over frame window (ex. 2s) for averaging
          energySumA += Math.pow(10, dba / 10);
          energySumC += Math.pow(10, dbc / 10);
          sampleCount++;

          // 4. Check for new peak
          if (peakC > maxPeakC) {
            maxPeakC = peakC;
          }

          // 5. Request UI update (effectively continuing sample loop)
          rafId = requestAnimationFrame(measureLoop);
        }

        measureLoop();

        // Publish every 2 seconds to Supabase
        publishTimer = setInterval(async () => {
          if (sampleCount === 0) return;

          const avgDba = Number((10 * Math.log10(energySumA / sampleCount)).toFixed(1));
          const avgDbc = Number((10 * Math.log10(energySumC / sampleCount)).toFixed(1));
          const peakDbc = Number(maxPeakC.toFixed(1));

          energySumA = 0;
          energySumC = 0;
          sampleCount = 0;
          maxPeakC = -Infinity;

          const { error } = await db.from('readings').insert({
            dba: avgDba,
            dbc: avgDbc,
            peak_dbc: peakDbc
          });

          const pubStatus = document.getElementById('pub-status');
          if (error) {
            pubStatus.textContent = 'Insert Error: ' + error.message;
            pubStatus.style.color = '#f87171';
          } else {
            pubStatus.textContent = `Broadcasting live (Last: ${avgDba} dBA / ${avgDbc} dBC)`;
            pubStatus.style.color = '#4ade80';
          }
        }, 2000);

        document.getElementById('start-mic-btn').classList.add('hidden');
        document.getElementById('stop-mic-btn').classList.remove('hidden');
      } catch (err) {
        alert('Microphone access error: ' + err.message);
      }
    });

    document.getElementById('stop-mic-btn').addEventListener('click', () => {
      cancelAnimationFrame(rafId);
      clearInterval(publishTimer);
      micStream?.getTracks().forEach((t) => t.stop());
      audioCtx?.close();
      wakeLock?.release();

      document.getElementById('start-mic-btn').classList.remove('hidden');
      document.getElementById('stop-mic-btn').classList.add('hidden');
      document.getElementById('pub-status').textContent = 'Stopped';
      document.getElementById('pub-status').style.color = '#94a3b8';
    });

    // ==========================================
    // Display modes
    // ==========================================
    let viewMode = 'live'; // 'live' | '1m' | '5m'
    let currentPoints = []; // normalized { ts, dba, dbc, peak }

    function setActiveModeButtons() {
      const modes = [
        { id: 'mode-live-btn', mode: 'live' },
        { id: 'mode-1m-btn', mode: '1m' },
        { id: 'mode-5m-btn', mode: '5m' }
      ];
      for (const m of modes) {
        const btn = document.getElementById(m.id);
        if (m.mode === viewMode) {
          btn.classList.remove('secondary');
        } else {
          btn.classList.add('secondary');
        }
      }
    }

    function renderSeriesToChart(points, limitToMax = false) {
      const sliced = limitToMax && points.length > MAX_POINTS
        ? points.slice(points.length - MAX_POINTS)
        : points;

      splChart.data.labels = sliced.map((p) => formatTime(p.ts));
      splChart.data.datasets[0].data = sliced.map((p) => p.dba);
      splChart.data.datasets[1].data = sliced.map((p) => p.dbc);
      splChart.data.datasets[2].data = sliced.map((p) => p.peak);
      splChart.update();

      if (sliced.length > 0) {
        const last = sliced[sliced.length - 1];
        document.getElementById('dba-val').textContent = last.dba.toFixed(1);
        document.getElementById('dbc-val').textContent = last.dbc.toFixed(1);
        document.getElementById('peak-val').textContent = last.peak.toFixed(1);
      }
    }

    /**
     * Flags notable dBC step changes (>= 4.0 dB jump or drop) between consecutive buckets.
     */
    function detectLevelChanges(points, stepThreshold = 4.0) {
      const events = [];
      for (let i = 1; i < points.length; i++) {
        const prev = points[i - 1];
        const curr = points[i];
        const delta = Number((curr.dbc - prev.dbc).toFixed(1));
        if (Math.abs(delta) >= stepThreshold) {
          events.push({
            ts: curr.ts,
            delta,
            fromDbc: prev.dbc,
            toDbc: curr.dbc,
            peakDbc: curr.peak
          });
        }
      }
      return events;
    }

    function renderEventsList(events) {
      const listEl = document.getElementById('events-list');
      const summaryEl = document.getElementById('events-summary');

      if (!events.length) {
        summaryEl.textContent = '0 shifts ≥ 4.0 dB';
        listEl.innerHTML = '<li>No dBC shifts ≥ 4.0 dB in this window.</li>';
        return;
      }

      summaryEl.textContent = `${events.length} shift${events.length === 1 ? '' : 's'} ≥ 4.0 dB`;
      // Show newest first so recent HVAC cycles are right at the top
      listEl.innerHTML = events
        .slice()
        .reverse()
        .map((ev) => {
          const sign = ev.delta > 0 ? '+' : '';
          const dirLabel = ev.delta > 0 ? 'Jump' : 'Drop';
          const color = ev.delta > 0 ? '#f472b6' : '#38bdf8';
          return `<li style="padding: 6px 0; border-bottom: 1px solid var(--border);">
            <span style="color: var(--text); font-weight: 600;">${formatTime(ev.ts)}</span>
            — <span style="color: ${color}; font-weight: 600;">${dirLabel} ${sign}${ev.delta.toFixed(1)} dBC</span>
            (${ev.fromDbc.toFixed(1)} → ${ev.toDbc.toFixed(1)} dBC, Peak ${ev.peakDbc.toFixed(1)} dBC)
          </li>`;
        })
        .join('');
    }

    function removeQueryParam(key) {
      const url = new URL(window.location.href);

      if (!url.searchParams.has(key)) {
        return false;
      }

      url.searchParams.delete(key);
      window.history.replaceState({}, "", url);
      return true;
    }

    function setQueryParam(key, value) {
      const url = new URL(window.location.href);

      if (value === null || value === undefined || value === "") {
        url.searchParams.delete(key);
      } else {
        url.searchParams.set(key, String(value));
      }

      window.history.replaceState({}, "", url);
    }

    function renderQuerystring() {
      const params = new URLSearchParams(window.location.search);
      if (viewMode === 'live') {
        // remove querystring options that we set
        removeQueryParam('rollupInterval');
        removeQueryParam('rollupWindow');
        removeQueryParam('rollupStart');
      } else {
        // set appropriately
        setQueryParam('rollupInterval', viewMode);
        setQueryParam('rollupWindow', document.getElementById('lookback-select').selectedOptions[0]?.textContent);
        function getTimestamp(inputEl) {
          const ms = new Date(inputEl.value).getTime();
          return Number.isFinite(ms) ? ms : null;
        }

        setQueryParam('rollupStart', getTimestamp(document.getElementById('window-start-input')));
      }
    }

    function lookbackToMs(lookbackStr) {
      const hourSpan = 3600000;
      const map = {
        '1 hour': 1 * hourSpan,
        '3 hours': 3 * hourSpan,
        '6 hours': 6 * hourSpan,
        '12 hours': 12 * hourSpan,
        '24 hours': 24 * hourSpan,
        '7 days': 7 * 24 * hourSpan
      };

      return map[lookbackStr] || 6 * 3600 * 1000
    }

    function sinceIsoFromLookback(lookbackStr) {
      const now = Date.now();
      return new Date(now - lookbackToMs(lookbackStr)).toISOString();
    }

    async function loadCurrentView() {
      const lookback = document.getElementById('lookback-select').value;
      const sinceIso = sinceIsoFromLookback(lookback);

      if (viewMode === 'live') {
        const { data, error } = await db
          .from('readings')
          .select('created_at, dba, dbc, peak_dbc')
          .gte('created_at', sinceIso)
          .order('created_at', { ascending: false })
          .limit(MAX_POINTS);

        if (error) return;
        currentPoints = (data || []).reverse().map((r) => ({
          ts: r.created_at,
          dba: Number(r.dba),
          dbc: Number(r.dbc),
          peak: Number(r.peak_dbc ?? r.dbc)
        }));
        renderSeriesToChart(currentPoints, true);
        renderEventsList(detectLevelChanges(currentPoints));
        return;
      }

      const bucketInterval = viewMode === '1m' ? '1 minute' : '5 minutes';
      const { data, error } = await db.rpc('get_spl_rollups', {
        p_bucket_interval: bucketInterval,
        p_since: sinceIso
      });

      if (error) {
        document.getElementById('events-summary').textContent = 'Rollup error: ' + error.message;
        return;
      }

      currentPoints = (data || []).map((row) => ({
        ts: row.bucket_start,
        dba: Number(row.dba_leq),
        dbc: Number(row.dbc_leq),
        peak: Number(row.peak_dbc_max ?? row.dbc_leq)
      }));
      renderSeriesToChart(currentPoints, false);
      renderEventsList(detectLevelChanges(currentPoints));
    }

    document.getElementById('mode-live-btn').addEventListener('click', () => {
      viewMode = 'live';
      activeCustom6h = false
      setActiveModeButtons();
      loadCurrentView();
      renderQuerystring();
    });

    document.getElementById('mode-1m-btn').addEventListener('click', () => {
      viewMode = '1m';
      setActiveModeButtons();
      loadCustom6h1mRollup();
    });

    document.getElementById('mode-5m-btn').addEventListener('click', () => {
      viewMode = '5m';
      setActiveModeButtons();
      loadCustom6h1mRollup();
    });

    document.getElementById('refresh-view-btn').addEventListener('click', () => {
      if (viewMode !== 'live') {
        setActiveModeButtons();
        loadCustom6h1mRollup();
      }
    });

    const SIX_HOURS_MS = 6 * 60 * 60 * 1000;
    let activeCustom6h = false;

    function toDatetimeLocalValue(dateObj) {
      const pad = (n) => String(n).padStart(2, '0');
      return `${dateObj.getFullYear()}-${pad(dateObj.getMonth() + 1)}-${pad(dateObj.getDate())}T${pad(dateObj.getHours())}:${pad(dateObj.getMinutes())}`;
    }

    function updateWindowRangeLabel(startDate) {
      const endDate = new Date(startDate.getTime() + SIX_HOURS_MS);
      const labelEl = document.getElementById('window-range-label');
      if (!labelEl) return;

      const opts = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      labelEl.textContent = `${startDate.toLocaleString([], opts)} → ${endDate.toLocaleString([], opts)}`;
    }

    function getSelected6hStartDate() {
      const input = document.getElementById('window-start-input');
      let startDate = input.value ? new Date(input.value) : new Date(Date.now() - SIX_HOURS_MS);

      if (Number.isNaN(startDate.getTime())) {
        startDate = new Date(Date.now() - SIX_HOURS_MS);
      }

      updateWindowRangeLabel(startDate);
      return startDate;
    }

    async function loadCustom6h1mRollup() {
      const lookback = document.getElementById('lookback-select');
      const startDate = getSelected6hStartDate();
      const endDate = new Date(startDate.getTime() + lookbackToMs(lookback.value));

      activeCustom6h = true;
      if (viewMode === 'live') {
        viewMode = '1m';
      }
      setActiveModeButtons();

      const summaryEl = document.getElementById('events-summary');
      if (summaryEl) summaryEl.textContent = 'Loading 6h (' + viewMode + ') rollup...';

      const bucketInterval = viewMode == '1m' ? '1 minute' : '5 minutes';

      const { data, error } = await db.rpc('get_spl_rollups', {
        p_bucket_interval: bucketInterval,
        p_since: startDate.toISOString(),
        p_until: endDate.toISOString()
      });

      if (error) {
        if (summaryEl) summaryEl.textContent = 'Rollup error: ' + error.message;
        return;
      }

      currentPoints = (data || []).map((row) => ({
        ts: row.bucket_start,
        dba: Number(row.dba_leq),
        dbc: Number(row.dbc_leq),
        peak: Number(row.peak_dbc_max ?? row.dbc_leq)
      }));

      renderSeriesToChart(currentPoints, false);
      renderEventsList(detectLevelChanges(currentPoints));
      renderQuerystring();
    }

    function init6hWindowControls() {
      const timeMap = {
        '1 hour': '1h',
        '3 hours': '3h',
        '6 hours': '6h',
        '12 hours': '12h',
        '24 hours': '24h',
        '7 days': '7d'
      };
      const queryStringTimeMap = new Map(Array.from(timeMap, ([key, value]) => [value, key]));
      const params = new URLSearchParams(window.location.search);
      const qRollupInterval = params.get('rollupInterval');
      const qRollupWindow = params.get('rollupWindow');
      const qRollupStart = params.get('rollupStart');

      const lookback = document.getElementById('lookback-select');
      const input = document.getElementById('window-start-input');
      const backBtn = document.getElementById('shift-back-6h-btn');
      const fwdBtn = document.getElementById('shift-fwd-6h-btn');
      const loadBtn = document.getElementById('load-6h-btn');
      const lookbackSelect = document.getElementById('lookback-select');

      if (!input || !backBtn || !fwdBtn || !loadBtn) return;

      // If set, set querystring interval, then window, then start
      if (qRollupInterval) {
        switch (qRollupInterval){
        case '1m':
          viewMode = '1m';
          break;
        case '5m':
          viewMode = '5m';
          break;
        default:
          viewMode = 'live';
          break;
        }

        if (viewMode !== 'live') {

          if (qRollupWindow) {
            const normalizedTarget = qRollupWindow.trim();
            const match = Array.from(lookback.options).find(
              (option) => option.textContent.trim() === normalizedTarget
            );
            if (match) {
              lookback.value = match.value;
            }
          }
        }
      } else {
        // if not set, ignore all other values and assume defaults
      }

      function formatLocalDateTime(date) {
        const pad = (n) => String(n).padStart(2, "0");
        const datePart = `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
        const timePart = `${pad(date.getHours())}:${pad(date.getMinutes())}`;
        return `${datePart}T${timePart}`;
      }

      function createStartDate() {
         return new Date(Date.now() - lookbackToMs(lookback.value));
      }

      let activeStartDate = createStartDate();
      input.value = toDatetimeLocalValue(activeStartDate);
      
      if (qRollupWindow && viewMode !== 'live' && qRollupStart) {
        const parsed = new Date(Number(qRollupStart));
        if (!Number.isNaN(parsed.getTime())) {
          activeStartDate = parsed;
          input.value = formatLocalDateTime(activeStartDate);
        } 
        loadCustom6h1mRollup();
      }
      updateWindowRangeLabel(activeStartDate);

      input.addEventListener('change', () => {
        getSelected6hStartDate();
        if (activeCustom6h) {
          loadCustom6h1mRollup();
        }
      });

      lookbackSelect.addEventListener('change', () => {
        backBtn.textContent = '-' + timeMap[lookback.value];
        fwdBtn.textContent = '+' + timeMap[lookback.value];
      });

      backBtn.addEventListener('click', () => {
        const currentStart = getSelected6hStartDate();
        const nextStart = new Date(currentStart.getTime() - lookbackToMs(lookback.value));
        input.value = toDatetimeLocalValue(nextStart);
        loadCustom6h1mRollup();
      });

      fwdBtn.addEventListener('click', () => {
        const currentStart = getSelected6hStartDate();
        const nextStart = new Date(currentStart.getTime() + lookbackToMs(lookback.value));
        input.value = toDatetimeLocalValue(nextStart);
        loadCustom6h1mRollup();
      });

      loadBtn.addEventListener('click', () => {
        // reset lookback values and display
        const select = document.getElementById("mySelect");

        // Restore whichever <option> had the `selected` attribute in HTML
        for (const option of lookback.options) {
          option.selected = option.defaultSelected;
        }
        const initialStart = createStartDate();
        input.value = toDatetimeLocalValue(initialStart);
        updateWindowRangeLabel(initialStart);
        viewMode = '1m';
        loadCustom6h1mRollup();
      });

      // call lookback select change listener
      lookbackSelect.dispatchEvent(new Event("change", { bubbles: true }));
    }

    init6hWindowControls();

    </script>
  </body>
</html>
